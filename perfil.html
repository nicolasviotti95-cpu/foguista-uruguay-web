<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Perfil | Foguista Uruguay</title>

<link
rel="icon"
type="image/png"
href="/logo.png"
>

<style>

:root{
    --navy:#071b2d;
    --blue:#0d4f82;
    --light:#f3f7fb;
    --border:#dce6ef;
    --text:#263746;
    --muted:#718096;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--light);
    color:var(--text);
}

header{
    background:var(--navy);
    padding:14px 28px;
}

.nav{
    max-width:1150px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:14px;
    color:white;
    text-decoration:none;
}

.logo-area img{
    width:52px;
    height:52px;
    object-fit:contain;
}

.logo-text{
    font-size:20px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    font-size:14px;
    padding:10px 16px;
    border:1px solid rgba(255,255,255,.3);
    border-radius:8px;
}

.back:hover{
    background:rgba(255,255,255,.08);
}

main{
    max-width:900px;
    margin:55px auto;
    padding:0 20px;
}

.profile-card{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:40px;
    box-shadow:0 12px 35px rgba(7,27,45,.08);
}

.profile-head{
    display:flex;
    align-items:center;
    gap:22px;
    padding-bottom:28px;
    border-bottom:1px solid var(--border);
}

.avatar{
    width:86px;
    height:86px;
    border-radius:50%;
    background:var(--navy);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    flex-shrink:0;
}

.profile-name{
    margin:0 0 8px;
    color:var(--navy);
    font-size:30px;
}

.profile-condition{
    margin:0;
    color:var(--blue);
    font-weight:bold;
    font-size:16px;
}

.profile-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-top:28px;
}

.profile-stat{
    padding:20px 12px;
    background:#f3f7fb;
    border:1px solid var(--border);
    border-radius:12px;
    text-align:center;
}

.profile-stat strong{
    display:block;
    color:var(--navy);
    font-size:22px;
    margin-bottom:6px;
}

.profile-stat span{
    display:block;
    color:var(--muted);
    font-size:12px;
}

.loading{
    text-align:center;
    padding:45px 10px;
    color:var(--muted);
}

.error{
    text-align:center;
    padding:45px 10px;
    color:#a33;
}

@media(max-width:650px){

    header{
        padding:12px 16px;
    }

    .logo-text{
        font-size:17px;
    }

    .logo-area img{
        width:45px;
        height:45px;
    }

    main{
        margin:30px auto;
    }

    .profile-card{
        padding:25px 18px;
    }

    .profile-head{
        flex-direction:column;
        text-align:center;
    }

    .profile-name{
        font-size:25px;
    }

    .profile-info{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

    <nav class="nav">

        <a
        href="/"
        class="logo-area"
        >

            <img
            src="/logo.png"
            alt="Foguista Uruguay"
            >

            <span class="logo-text">
                Foguista Uruguay
            </span>

        </a>


        <a
        href="/comunidad.html"
        class="back"
        >
            ← Volver a Comunidad
        </a>

    </nav>

</header>


<main>

    <section
    class="profile-card"
    id="profileCard"
    >

        <div class="loading" id="loading">

            Cargando perfil...

        </div>


        <div
        id="profileContent"
        style="display:none;"
        >

            <div class="profile-head">

                <div class="avatar">
                    👤
                </div>


                <div>

                    <h1
                    class="profile-name"
                    id="profileName"
                    >
                    Usuario
                    </h1>


                    <p
                    class="profile-condition"
                    id="profileCondition"
                    >
                    Foguista
                    </p>

                </div>

            </div>


            <div class="profile-info">

                <div class="profile-stat">

                    <strong id="profileMember">
                        —
                    </strong>

                    <span>
                        Miembro desde
                    </span>

                </div>


                <div class="profile-stat">

                    <strong id="profileQuestions">
                        0
                    </strong>

                    <span>
                        Preguntas
                    </span>

                </div>


                <div class="profile-stat">

                    <strong id="profileAnswers">
                        0
                    </strong>

                    <span>
                        Respuestas
                    </span>

                </div>

            </div>

        </div>


        <div
        class="error"
        id="profileError"
        style="display:none;"
        >

            No se pudo encontrar este perfil.

        </div>

    </section>

</main>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyAMwiZKPAOZfW7mdgHll6LbDF-n1lv1tUM",

    authDomain:
    "foguista-uruguay.firebaseapp.com",

    projectId:
    "foguista-uruguay",

    storageBucket:
    "foguista-uruguay.firebasestorage.app",

    messagingSenderId:
    "26845359651",

    appId:
    "1:26845359651:web:c7f5c04ab51fdababb8b96",

    measurementId:
    "G-GS53T440NK"

};


const app =
initializeApp(
    firebaseConfig
);


const db =
getFirestore(
    app
);


const params =
new URLSearchParams(
    window.location.search
);


const uid =
params.get("id");


async function loadProfile(){

    if(!uid){

        showError();

        return;

    }


    try{

        const userRef =
        doc(
            db,
            "users",
            uid
        );


        const userSnapshot =
        await getDoc(
            userRef
        );


        if(
            !userSnapshot.exists()
        ){

            showError();

            return;

        }


        const profile =
        userSnapshot.data();


        document
        .getElementById(
            "profileName"
        )
        .textContent =
        profile.name
        ||
        "Usuario";


        document
        .getElementById(
            "profileCondition"
        )
        .textContent =
        profile.condition
        ||
        "Foguista";


        if(
            profile.memberSince
        ){

            const date =
            profile.memberSince.toDate
            ?
            profile.memberSince.toDate()
            :
            new Date(
                profile.memberSince
            );

            let text =
            date.toLocaleDateString(
                "es-UY",
                {
                    month:"long",
                    year:"numeric"
                }
            );

            text =
            text.charAt(0).toUpperCase()
            +
            text.slice(1);

            document
            .getElementById(
                "profileMember"
            )
            .textContent =
            text;

        }


        const postsSnapshot =
        await getDocs(
            collection(
                db,
                "posts"
            )
        );


        const posts =
        postsSnapshot.docs.map(
            d => ({
                id:d.id,
                ...d.data()
            })
        );


        const questionCount =
        posts.filter(
            post =>
            post.authorId === uid
        ).length;


        document
        .getElementById(
            "profileQuestions"
        )
        .textContent =
        questionCount;


        let answerCount = 0;


        await Promise.all(

            posts.map(
                async post => {

                    try{

                        const repliesSnapshot =
                        await getDocs(

                            collection(
                                db,
                                "posts",
                                post.id,
                                "replies"
                            )

                        );


                        answerCount +=
                        repliesSnapshot.docs.filter(
                            reply =>
                            reply.data().authorId === uid
                        ).length;

                    }catch(e){

                        console.error(
                            e
                        );

                    }

                }
            )

        );


        document
        .getElementById(
            "profileAnswers"
        )
        .textContent =
        answerCount;


        document
        .getElementById(
            "loading"
        )
        .style.display =
        "none";


        document
        .getElementById(
            "profileContent"
        )
        .style.display =
        "block";


    }catch(e){

        console.error(
            e
        );

        showError();

    }

}


function showError(){

    document
    .getElementById(
        "loading"
    )
    .style.display =
    "none";


    document
    .getElementById(
        "profileError"
    )
    .style.display =
    "block";

}


loadProfile();

</script>

</body>
</html>
