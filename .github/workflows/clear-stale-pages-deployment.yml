name: Clear stale Pages deployment lock

on:
  workflow_dispatch:
    inputs:
      deployment_sha:
        description: "Commit SHA of the stale GitHub Pages deployment"
        required: true
        type: string

permissions:
  deployments: write

jobs:
  clear-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Mark the stale deployment inactive
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.inputs?.deployment_sha;
            if (!sha) throw new Error("Missing deployment SHA");

            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              per_page: 100
            });

            const deployment = deployments.find(item =>
              item.sha === sha && item.environment === "github-pages"
            );

            if (!deployment) {
              throw new Error(`No github-pages deployment found for ${sha}`);
            }

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "inactive",
              description: "Liberando estado obsoleto de GitHub Pages",
              auto_inactive: false
            });

            core.info(`Marked deployment ${deployment.id} for ${sha} inactive.`);
