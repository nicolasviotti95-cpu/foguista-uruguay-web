<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Foguista Uruguay. Formación técnica, seguridad, normativa y estudio para operadores de generadores de vapor.">

<link rel="canonical" href="https://foguistauruguay.uy/">

<link rel="icon" type="image/png" href="https://foguistauruguay.uy/logo-foguista-nuevo.png">
<link rel="shortcut icon" type="image/png" href="https://foguistauruguay.uy/logo-foguista-nuevo.png">
<link rel="apple-touch-icon" href="https://foguistauruguay.uy/logo-foguista-nuevo.png">

<title>Foguista Uruguay | Formación técnica</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f7fa;
    color:#173b60;
    line-height:1.5;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    display:block;
    max-width:100%;
}

:root{
    --navy:#062b4f;
    --navy-dark:#031d36;
    --blue:#1198e5;
    --blue-dark:#087fc5;
    --blue-light:#e8f5fc;
    --text:#173b60;
    --muted:#607b95;
    --white:#ffffff;
    --border:#dce7ef;
}


/* =====================================================
   HEADER
===================================================== */

.site-header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#062b4f;
    box-shadow:0 3px 18px rgba(0,0,0,.16);
}

.header-inner{
    max-width:1280px;
    min-height:76px;
    margin:auto;
    padding:8px 28px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:25px;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;

    color:white;
    flex-shrink:0;
}

.brand-logo{
    width:58px;
    height:58px;
    object-fit:contain;
    border-radius:12px;
}

.brand-name{
    font-size:21px;
    font-weight:800;
}

.brand-subtitle{
    display:block;
    margin-top:2px;
    font-size:11px;
    color:#c8d9e8;
}

.main-nav{
    display:flex;
    align-items:center;
    gap:3px;
}

.main-nav a{
    padding:10px 10px;
    border-radius:7px;

    color:#e8f1f8;

    font-size:13px;
    font-weight:600;

    white-space:nowrap;

    transition:.2s;
}

.main-nav a:hover{
    background:rgba(17,152,229,.18);
    color:white;
}

.main-nav .nav-app{
    background:#1198e5;
    color:white;

    padding-left:15px;
    padding-right:15px;
}

.main-nav .nav-app:hover{
    background:#087fc5;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    position:relative;
    overflow:hidden;

    background:#031d36;
    color:white;
}

.hero-inner{
    max-width:1280px;
    min-height:575px;

    margin:auto;
    padding:55px 28px;

    display:grid;
    grid-template-columns:.82fr 1.18fr;

    align-items:stretch;
    gap:34px;
}

.hero-copy{
    position:relative;
    z-index:5;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.hero-label{
    display:inline-flex;
    align-items:center;
    gap:8px;

    width:max-content;

    margin-bottom:20px;
    padding:7px 13px;

    border:1px solid rgba(17,152,229,.45);
    border-radius:30px;

    background:rgba(17,152,229,.08);

    color:#70c9f5;

    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
}

.hero-label::before{
    content:"";

    width:7px;
    height:7px;

    border-radius:50%;

    background:#1198e5;
}

.hero h1{
    max-width:650px;

    margin-bottom:20px;

    font-size:clamp(42px,5vw,64px);

    line-height:1.03;
    letter-spacing:-2px;
}

.hero h1 span{
    color:#1198e5;
}

.hero-description{
    max-width:590px;

    margin-bottom:30px;

    color:#cbdceb;

    font-size:18px;
    line-height:1.65;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;

    gap:12px;

    margin-bottom:34px;
}

.button{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-height:47px;

    padding:0 22px;

    border-radius:7px;

    font-size:14px;
    font-weight:700;

    transition:.2s;
}

.button:hover{
    transform:translateY(-2px);
}

.button-primary{
    background:#1198e5;
    color:white;
}

.button-primary:hover{
    background:#087fc5;
}

.button-secondary{
    border:1px solid rgba(255,255,255,.4);

    background:rgba(255,255,255,.03);

    color:white;
}

.button-secondary:hover{
    background:rgba(255,255,255,.10);
}

.hero-points{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    max-width:620px;

    gap:18px;
}

.hero-point{
    display:flex;
    align-items:flex-start;

    gap:9px;
}

.hero-point-icon{
    width:31px;
    height:31px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:7px;

    background:rgba(17,152,229,.13);

    font-size:17px;
}

.hero-point strong{
    display:block;

    margin-bottom:2px;

    color:white;

    font-size:11px;
}

.hero-point small{
    display:block;

    color:#91abc0;

    font-size:10px;

    line-height:1.35;
}


/* =====================================================
   IMAGEN
===================================================== */

.hero-visual{
    position:absolute;
    z-index:1;
    top:0;
    right:0;
    width:64%;
    height:100%;
    min-height:575px;
    display:block;
    pointer-events:none;
}

.hero-visual::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            90deg,
            #031d36 0%,
            rgba(3,29,54,.96) 9%,
            rgba(3,29,54,.70) 22%,
            rgba(3,29,54,.22) 38%,
            rgba(3,29,54,0) 52%
        );
    z-index:2;
}

.hero-image{
    width:100%;
    height:100%;
    min-height:575px;
    object-fit:cover;
    object-position:right center;
    border-radius:0;
    opacity:.98;
}

/* =====================================================
   INTRO
===================================================== */

.intro{
    background:white;

    border-bottom:1px solid #dce7ef;
}

.intro-inner{
    max-width:1050px;

    margin:auto;

    padding:65px 28px;

    text-align:center;
}

.section-tag{
    display:inline-block;

    margin-bottom:9px;

    color:#1198e5;

    font-size:11px;
    font-weight:800;

    letter-spacing:1px;
}

.intro h2{
    margin-bottom:13px;

    color:#062b4f;

    font-size:34px;

    letter-spacing:-.7px;
}

.intro p{
    max-width:770px;

    margin:auto;

    color:#607b95;

    font-size:16px;

    line-height:1.7;
}


/* =====================================================
   ÁREAS
===================================================== */

.content-section{
    max-width:1220px;

    margin:auto;

    padding:72px 28px;
}

.section-heading{
    display:flex;

    align-items:flex-end;
    justify-content:space-between;

    gap:30px;

    margin-bottom:30px;
}

.section-heading h2{
    color:#062b4f;

    font-size:32px;

    letter-spacing:-.7px;
}

.section-heading p{
    max-width:530px;

    color:#607b95;

    font-size:14px;

    line-height:1.6;
}

.areas-grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:18px;
}

.area-card{
    position:relative;

    min-height:305px;

    padding:25px 22px 55px;

    background:white;

    border:1px solid #dce7ef;

    border-radius:14px;

    box-shadow:
        0 8px 25px rgba(15,55,85,.05);

    overflow:hidden;

    transition:.2s;
}

.area-card:hover{
    transform:translateY(-4px);

    box-shadow:
        0 15px 35px rgba(15,55,85,.10);
}

.area-card::before{
    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:4px;

    background:#1198e5;
}

.area-icon{
    width:48px;
    height:48px;

    margin-bottom:20px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:#e8f5fc;

    font-size:25px;
}

.area-card h3{
    margin-bottom:11px;

    color:#062b4f;

    font-size:20px;
}

.area-card p{
    color:#607b95;

    font-size:13px;

    line-height:1.65;
}

.area-link{
    position:absolute;

    left:22px;
    bottom:20px;

    color:#1198e5;

    font-size:12px;

    font-weight:800;
}

.area-link::after{
    content:" →";
}


/* =====================================================
   MÉTODO DE ESTUDIO
===================================================== */

.study-section{
    background:#eaf4fa;

    border-top:1px solid #dceaf3;
    border-bottom:1px solid #dceaf3;
}

.study-inner{
    max-width:1220px;

    margin:auto;

    padding:72px 28px;
}

.study-header{
    max-width:700px;

    margin-bottom:38px;
}

.study-header h2{
    margin-bottom:12px;

    color:#062b4f;

    font-size:34px;

    letter-spacing:-.7px;
}

.study-header p{
    color:#607b95;

    font-size:15px;
}

.study-path{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:14px;
}

.study-step{
    position:relative;

    padding:23px 18px;

    background:white;

    border:1px solid #dce7ef;

    border-radius:12px;
}

.study-step:not(:last-child)::after{
    content:"→";

    position:absolute;

    right:-17px;
    top:31px;

    z-index:5;

    color:#80b7d7;

    font-size:20px;
}

.step-number{
    margin-bottom:13px;

    color:#1198e5;

    font-size:11px;

    font-weight:800;
}

.study-step h3{
    margin-bottom:7px;

    color:#062b4f;

    font-size:15px;
}

.study-step p{
    color:#607b95;

    font-size:11px;

    line-height:1.55;
}


/* =====================================================
   CONCEPTOS
===================================================== */

.concepts-section{
    position:relative;
    overflow:hidden;
    background:#f7fbff;
}

.concepts-section::after{
    content:"";
    position:absolute;

    width:520px;
    height:520px;

    right:-180px;
    top:40px;

    opacity:.08;
    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            transparent 49%,
            #159ee8 50%,
            transparent 51%
        ),
        linear-gradient(
            0deg,
            transparent 49%,
            #159ee8 50%,
            transparent 51%
        );

    background-size:38px 38px;

    transform:rotate(12deg);

    mask-image:
        radial-gradient(
            circle,
            #000 0%,
            transparent 70%
        );

    -webkit-mask-image:
        radial-gradient(
            circle,
            #000 0%,
            transparent 70%
        );
}

.concepts-grid{
    position:relative;
    z-index:2;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:16px;
}

.concept-card{
    position:relative;

    display:flex;
    align-items:flex-start;

    gap:15px;

    padding:21px;

    background:#ffffff;

    border:1px solid #e5eef6;

    border-radius:16px;

    box-shadow:
        0 8px 25px rgba(3,29,54,.07);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;

    overflow:hidden;
}

.concept-card::before{
    content:"";

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:3px;

    background:
        linear-gradient(
            90deg,
            #159ee8,
            #52c7ff
        );

    opacity:.8;
}

.concept-card:hover{
    transform:translateY(-6px);

    border-color:#b9ddf4;

    box-shadow:
        0 16px 35px rgba(3,29,54,.12);
}

.concept-icon{
    width:42px;
    height:42px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:#e8f5fc;

    font-size:21px;

    transition:
        transform .25s ease;
}

.concept-card:hover .concept-icon{
    transform:scale(1.06);
}

.concept-card h3{
    margin-bottom:4px;

    color:#062b4f;

    font-size:15px;
}

.concept-card p{
    color:#607b95;

    font-size:11px;

    line-height:1.5;
}

.concept-icon{
    width:42px;
    height:42px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:9px;

    background:#e8f5fc;

    font-size:21px;
}

.concept-card h3{
    margin-bottom:4px;

    color:#062b4f;

    font-size:15px;
}

.concept-card p{
    color:#607b95;

    font-size:11px;

    line-height:1.5;
}


/* =====================================================
   NORMATIVA
===================================================== */

.normativa-section{
    position:relative;
    overflow:hidden;

    background:#031d36;

    color:#ffffff;
}

.normativa-section::before{
    content:"";

    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            rgba(3,29,54,.98) 0%,
            rgba(3,29,54,.90) 42%,
            rgba(3,29,54,.72) 100%
        ),
        repeating-linear-gradient(
            90deg,
            rgba(21,158,232,.08) 0,
            rgba(21,158,232,.08) 1px,
            transparent 1px,
            transparent 55px
        ),
        repeating-linear-gradient(
            0deg,
            rgba(21,158,232,.06) 0,
            rgba(21,158,232,.06) 1px,
            transparent 1px,
            transparent 55px
        );
}

.normativa-section::after{
    content:"URSEA";

    position:absolute;

    right:5%;
    top:50%;

    transform:translateY(-50%);

    font-size:150px;
    font-weight:900;

    letter-spacing:8px;

    color:rgba(255,255,255,.025);

    pointer-events:none;
}

.normativa-inner{
    position:relative;
    z-index:2;

    max-width:1220px;

    margin:auto;
    padding:72px 28px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:60px;

    align-items:center;
}

.normativa-copy .section-tag{
    color:#65c5f4;
}

.normativa-copy h2{
    margin-bottom:15px;

    color:#ffffff;

    font-size:35px;

    line-height:1.15;
}

.normativa-copy p{
    max-width:570px;

    margin-bottom:22px;

    color:rgba(255,255,255,.82);

    font-size:14px;

    line-height:1.7;
}

.normativa-points{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:12px;
}

.normativa-point{
    padding:16px;

    border:1px solid rgba(21,158,232,.18);

    border-radius:10px;

    background:rgba(255,255,255,.045);

    transition:
        transform .25s ease,
        background .25s ease;
}

.normativa-point:hover{
    transform:translateX(5px);

    background:rgba(21,158,232,.12);
}

.normativa-point strong{
    display:block;

    margin-bottom:4px;

    color:#ffffff;

    font-size:13px;
}

.normativa-point span{
    color:#a9c1d4;

    font-size:11px;

    line-height:1.45;
}

.normativa-box{
    position:relative;
    overflow:hidden;

    padding:32px;

    border:1px solid rgba(21,158,232,.30);

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            rgba(21,158,232,.14),
            rgba(255,255,255,.035)
        );

    box-shadow:
        0 20px 50px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.06);
}

.normativa-box::after{
    content:"";

    position:absolute;

    width:230px;
    height:230px;

    right:-100px;
    bottom:-110px;

    border:1px solid rgba(21,158,232,.20);

    border-radius:50%;

    box-shadow:
        0 0 0 35px rgba(21,158,232,.035),
        0 0 0 70px rgba(21,158,232,.025);
}

.normativa-box-label{
    margin-bottom:12px;

    color:#65c5f4;

    font-size:11px;

    font-weight:800;

    letter-spacing:1px;
}

.normativa-box h3{
    margin-bottom:12px;

    color:#ffffff;

    font-size:25px;
}

.normativa-box p{
    margin-bottom:22px;

    color:#bcd0df;

    font-size:13px;

    line-height:1.65;
}


/* =====================================================
   APP
===================================================== */

.app-section{
    position:relative;

    overflow:hidden;

    background:#f5faff;
}

.app-section::before{
    content:"";

    position:absolute;

    width:520px;
    height:520px;

    right:-100px;
    top:50%;

    transform:translateY(-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(21,158,232,.20) 0%,
            rgba(21,158,232,.10) 35%,
            rgba(21,158,232,0) 70%
        );

    pointer-events:none;
}

.app-inner{
    position:relative;

    z-index:2;

    max-width:1050px;

    margin:auto;

    padding:72px 28px;

    display:grid;

    grid-template-columns:.9fr 1.1fr;

    gap:60px;

    align-items:center;
}

.app-image{
    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;
}

.app-image::before{
    content:"";

    position:absolute;

    width:300px;
    height:300px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:rgba(21,158,232,.10);

    filter:blur(10px);

    z-index:0;
}

.app-image img{
    position:relative;

    z-index:1;

    max-width:280px;

    filter:
        drop-shadow(
            0 25px 35px
            rgba(3,29,54,.18)
        );

    transition:
        transform .3s ease;
}

.app-image:hover img{
    transform:translateY(-5px);
}

.app-copy{
    position:relative;

    z-index:2;
}

.app-copy h2{
    margin-bottom:15px;

    color:#062b4f;

    font-size:34px;

    line-height:1.15;
}

.app-copy p{
    margin-bottom:22px;

    color:#607b95;

    font-size:15px;

    line-height:1.7;
}

.app-list{
    display:grid;

    gap:10px;

    margin-bottom:25px;
}

.app-list > div{
    transition:
        transform .2s ease;
}

.app-list > div:hover{
    transform:translateX(4px);
}

.app-list span{
    color:#1198e5;

    font-weight:800;

    margin-right:8px;
}


/* =====================================================
   BOTONES
===================================================== */

.button-primary{
    box-shadow:
        0 8px 20px rgba(21,158,232,.22);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.button-primary:hover{
    transform:translateY(-2px);

    box-shadow:
        0 12px 26px rgba(21,158,232,.32);
}


/* =====================================================
   CTA FINAL
===================================================== */

.final-cta{
    position:relative;

    overflow:hidden;

    background:#031d36;

    color:#ffffff;

    border-top:none;
}

.final-cta::before{
    content:"";

    position:absolute;

    inset:0;

    background:
        radial-gradient(
            circle at 80% 50%,
            rgba(21,158,232,.18),
            transparent 38%
        ),
        linear-gradient(
            90deg,
            rgba(3,29,54,.98),
            rgba(3,29,54,.82)
        );

    pointer-events:none;
}

.final-cta::after{
    content:"";

    position:absolute;

    right:-100px;
    bottom:-160px;

    width:480px;
    height:480px;

    border-radius:50%;

    border:
        1px solid rgba(21,158,232,.15);

    box-shadow:
        0 0 0 50px rgba(21,158,232,.035),
        0 0 0 100px rgba(21,158,232,.025);

    pointer-events:none;
}

.final-cta-inner{
    position:relative;

    z-index:2;

    max-width:950px;

    margin:auto;

    padding:75px 28px;

    text-align:center;
}

.final-cta h2{
    margin-bottom:14px;

    color:#ffffff;

    font-size:36px;

    letter-spacing:-.8px;
}

.final-cta p{
    max-width:700px;

    margin:0 auto 25px;

    color:rgba(255,255,255,.80);

    font-size:15px;

    line-height:1.7;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    .normativa-inner{
        grid-template-columns:1fr;
    }

    .app-inner{
        grid-template-columns:1fr;
    }

    .app-image{
        order:2;
    }

    .app-copy{
        order:1;
    }

}

@media(max-width:850px){

    .normativa-section::after{
        font-size:80px;

        right:-20px;
    }

    .normativa-points{
        grid-template-columns:1fr;
    }

    .app-section::before{
        width:360px;
        height:360px;

        right:-150px;
    }

}

    }
